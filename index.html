ted by natural disasters and humanitarian crises.`,bullets:[`Disaster relief and flood response operations`,`Emergency shelter and supplies distribution`,`Medical camps in crisis-affected areas`,`Rapid deployment volunteer teams`],stat:{value:`12,000+`,label:`Families in crisis aided`}},{slug:`education-support`,title:`Education Support`,short:`School supplies, scholarships, and learning opportunities for children.`,image:`/images/youth-unity/youth-unity (10).jpeg`,detail:`Education breaks the cycle of poverty. Our education support program provides school supplies, scholarships, tutoring, and learning resources to children from disadvantaged backgrounds, giving them the tools to build brighter futures.`,bullets:[`School supplies and uniform distribution`,`Scholarship programs for deserving students`,`After-school tutoring and mentoring`,`Digital literacy through our IT center`],stat:{value:`3,000+`,label:`Students supported`}},{slug:`it-center`,title:`IT Center Empowerment`,short:`Free computer training and digital skills for youth.`,image:`/images/it-center/it-empower-1.png`,detail:`Our IT Center empowers young people with free computer training and digital skills. From basic computer literacy to advanced courses, we prepare youth for the modern workforce and create pathways to employment and entrepreneurship.`,bullets:[`Free computer and internet literacy courses`,`Professional software training programs`,`Career guidance and job placement support`,`Certification upon course completion`],stat:{value:`800+`,label:`Youth trained`}},{slug:`volunteer`,title:`Volunteer-Led Humanitarian Action`,short:`A growing network of volunteers driving every mission forward.`,image:`/images/Volunteer/FB_IMG_1774365524104.jpg`,detail:`Our strength lies in our people. With over 1,200 active volunteers, we mobilize communities to take action. From food drives to medical camps to disaster response, our volunteers are the heart of every mission.`,bullets:[`1,200+ active volunteers worldwide`,`Community mobilization and training`,`Youth leadership development programs`,`Corporate and group volunteer partnerships`],stat:{value:`1,200+`,label:`Active volunteers`}},{slug:`winter-relief`,title:`Winter Relief Drive`,short:`Blankets, warm clothing and food support for families facing harsh winters.`,image:`/images/youth-unity/food-section-1.png`,detail:`When winter arrives, vulnerable families face bitter cold without basic protection. Our Winter Relief Drive delivers blankets, warm clothing, winter kits and food support to poor families, elderly people and children — so no one is left to face the cold alone. Your winter donation, Sadqa or Zakat brings warmth and dignity to those who need it most.`,bullets:[`Blanket and warm clothing distribution drives`,`Winter food packages for vulnerable households`,`Heating support for elderly and shelterless families`,`Emergency winter assistance during cold waves`],stat:{value:`2,000+`,label:`Winter kits distributed`}},{slug:`child-education-support`,title:`Child Education Support`,short:`School fees, books, uniforms and sponsorships for deserving children.`,image:`/images/youth-unity/youth-unity (11).jpeg`,detail:`Every child deserves a classroom, not a life of labor. Our Child Education Support program sponsors school fees, books, uniforms and learning materials for deserving children from struggling families. With your Zakat, Sadqa or monthly sponsorship, a child stays in school and dreams stay alive — because education is the strongest weapon against poverty.`,bullets:[`School fee sponsorships for deserving children`,`Books, uniforms and stationery distribution`,`Orphan and street-children education support`,`Monthly child sponsorship program for donors`],stat:{value:`500+`,label:`Children sponsored`}},{slug:`ramadan-ration`,title:`Ramadan Ration Program`,short:`Sehri and Iftar ration packages for fasting families every Ramadan.`,image:`/images/youth-unity/food-distribution-2.png`,detail:`Ramadan is the month },{n:4,title:`Measure Impact`,desc:`We track our impact and share transparent reports with our donors and community.`}],$n=[{src:`/images/field/meal-distribution-2.jpg`,alt:`Fresh meals served by volunteers`},{src:`/images/field/meal-distribution-3.jpg`,alt:`Volunteers preparing drinks for meal distribution`},{src:`/images/youth-unity/food-distribution-2.png`,alt:`Food distribution drive`},{src:`/images/youth-unity/medical-section-3.png`,alt:`Medical support for children`},{src:`/images/Volunteer/FB_IMG_1774365552059.jpg`,alt:`Volunteers at work`},{src:`/images/Flood Rashan Campign/FB_IMG_1774365609366.jpg`,alt:`Flood ration campaign`},{src:`/images/youth-unity/youth-unity (15).jpeg`,alt:`Community support event`},{src:`/images/FLOOD Relief Medical Camp/FB_IMG_1774365652616.jpg`,alt:`Flood relief medical camp`}],er=[{name:`Ayesha R.`,role:`Monthly Donor`,quote:`I've been donating to Youth Unity Welfare for over a year now. Their transparency and dedication to helping families is truly inspiring. Every donation makes a real difference.`},{name:`Imran K.`,role:`Volunteer`,quote:`Volunteering with this organization changed my life. Seeing the smiles on children's faces when they receive food and medical care is priceless. I'm proud to be part of this mission.`},{name:`Sarah M.`,role:`Donor`,quote:`The Ramadan food drive organized by Youth Unity Welfare reached so many families in need. Their work is organized, transparent, and truly impactful.`}],tr=[{q:`How is my donation used?`,a:`Your donations directly fund our programs including food distribution, children's medical treatment, emergency aid, and education support. We maintain full transparency in how funds are allocated and regularly share impact reports.`},{q:`Is my donation tax-deductible?`,a:`Yes! Youth Unity Welfare Organization is a 501(c)(3) tax-exempt nonprofit organization. All donations made to us are tax-deductible to the extent allowed by law. You will receive a receipt for your donation.`},{q:`Can I donate in currencies other than USD?`,a:`Absolutely. While donations are processed in USD through PayPal, you can view equivalent amounts in PKR and GBP using our currency selector. PayPal will handle the conversion automatically.`},{q:`How can I volunteer with your organization?`,a:`We welcome volunteers! With over 1,200 active volunteers, there are many ways to get involved — from food drives to medical camps to administrative support. Contact us to learn about current volunteer opportunities.`},{q:`Do you provide donation receipts?`,a:`Yes, you will receive a donation receipt via email from PayPal after your contribution. For bank transfers, please contact us with your transfer details and we will provide an official receipt.`}],nr=[{name:`Ahmed Hassan`,role:`Founder & President`,image:`/images/team/ahmed.webp`,bio:`Ahmed founded Youth Unity Welfare Organization with a vision to create lasting change in communities. His leadership has guided the organization through countless successful humanitarian missions.`},{name:`Muhammad Farooq`,role:`Vice President`,image:`/images/team/farooq-image.webp`,bio:`Muhammad oversees operations and program development, ensuring that every initiative runs efficiently and reaches those who need it most.`},{name:`Hafiz Muhammad Waqas`,role:`Program Director`,image:`/images/team/waqas.webp`,bio:`Waqas leads our field programs and volunteer coordination, bringing dedication and compassion to every community we serve.`}],rr=[`Food Distribution`,`Children's Medical Treatment`,`Emergency Relief`,`Education Support`,`IT Center Programs`,`General Fund`],ir=`data:image/webp;base64,UklGRvQpAABXRUJQVlA4WAoAAAAgAAAA/wAA/wAASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAA
